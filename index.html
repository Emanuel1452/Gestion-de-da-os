<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width , initial-scale=1.0">
    <title>I.E. María Cano - Login</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <main class="tarjeta-login">
        
        <header>
            <h1>I.E. MARÍA CANO</h1>
            <p class="subtitulo">Sistema de Gestión de Daños</p>
        </header>

        <form id="form-login" action="admin.html" method="GET">
            
            <div class="campo-formulario">
                <label for="usuario">USUARIO:</label>
                <input type="text" id="usuario" name="usuario" placeholder="admin@iemariacano.edu.co" required>
            </div>

            <div class="campo-formulario">
                <label for="contrasena">CONTRASEÑA:</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="*************" required>
            </div>

            <input type="submit" class="boton-enviar" value="INGRESAR AL SISTEMA">
            
        </form>

        <footer>
            <p class="estado-usuario">Usuario: admin_general ● En Línea</p>
        </footer>

    </main>

</body>
</html>
